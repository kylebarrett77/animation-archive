#############################################################
# Scheduled data refresh — the only part of the system that
# talks to Notion.
#
# Fetches films, related entities, posters and watch links,
# re-validates watch links (writing changed statuses back to
# Notion), sanity-checks the snapshot, smoke-builds, and commits
# data/** to main. That push triggers Netlify, which builds the
# site from the committed snapshot; Netlify never calls Notion.
#
# Setup: add the repository secret NOTION_TOKEN
#   (Settings -> Secrets and variables -> Actions).
#   NOTION_DATABASE_ID is optional; scripts default to the Films DB.
#
# Cadence: daily 06:00 UTC, or manually (Actions -> Run workflow).
#
# A commit (and so a Netlify build) only happens when catalog data
# actually changes; refreshed reports never trigger one on their own.
# The keepalive step stops GitHub from auto-disabling the schedule
# after 60 days without commits, which is what froze the site in 2026.
#############################################################

name: Fetch Notion data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_commit:
        description: 'Dry run: fetch, check and build, but do not commit'
        type: boolean
        default: false
      skip_validate:
        description: 'Skip watch-link validation (no write-back to Notion)'
        type: boolean
        default: false

concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write   # commit the refreshed snapshot
  actions: write    # keepalive: re-enable this workflow

jobs:
  refresh:
    name: Refresh Notion snapshot
    runs-on: ubuntu-latest
    # Link validation probes ~2,000 URLs and the build takes ~10 min.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch films, entities, posters and watch links
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run fetch:all

      # Re-classify watch links (platform policy + HTTP probe) and write
      # changed statuses back to Notion. A network blip on one platform
      # should not halt the snapshot, so failures here are tolerated.
      - name: Validate watch links (writes changed statuses to Notion)
        if: ${{ !inputs.skip_validate }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        continue-on-error: true
        run: node scripts/validate-watch-links.js --fix

      # Re-fetch so the committed snapshot reflects the statuses just written.
      - name: Re-fetch watch links after validation
        if: ${{ !inputs.skip_validate }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run fetch:links

      - name: Sanity-check snapshot
        run: npm run check:data

      - name: Audit snapshot (report only)
        run: npm run audit

      - name: Smoke build
        run: npm run build

      - name: Commit refreshed data
        if: ${{ !inputs.skip_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/films.json data/studios.json data/directors.json \
                  data/series.json data/stats.json data/watch-links.json
          git add -A data/posters
          if git diff --cached --quiet; then
            echo "No catalog changes; nothing to commit."
            exit 0
          fi
          # Ride along with a real change only; never commit reports alone.
          git add data/*-report.json
          git commit -m "chore(data): refresh Notion snapshot $(date -u +'%Y-%m-%d')"
          git push origin HEAD:main

      - name: Keepalive (prevent 60-day auto-disable)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fetch-data.yml/enable"
