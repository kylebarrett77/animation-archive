#############################################################
# Global Animation Archive — Netlify configuration
#
# Build strategy:
#   - Netlify builds ONLY from the data snapshot committed in data/**.
#     It never calls Notion, so builds are deterministic and need no
#     NOTION_TOKEN (the old Netlify env var can be deleted).
#   - .github/workflows/fetch-data.yml is the single place that talks
#     to Notion: it refreshes data/** daily and commits it to main,
#     and that push triggers a Netlify production build.
#   - Deploy previews and branch deploys build that branch's own
#     committed snapshot.
#############################################################

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node version comes from .nvmrc (shared with local nvm and GitHub
  # Actions). Do not set NODE_VERSION here — it would override .nvmrc.
  NETLIFY_USE_YARN = "false"

#############################################################
# Deploy contexts: every non-production deploy uses the same build.
#############################################################

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

#############################################################
# Security headers (applied to every response)
#
# CSP is intentionally permissive for inline styles/scripts because
# build-site.js embeds JSON-LD and a small inline script block with
# window.ALL_FILMS_DATA. Tighten to nonce-based CSP in a later pass
# after app.js is split from inline bootstrap.
#############################################################

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

#############################################################
# Cache policy
#############################################################

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Content-hashed JS bundles (Batch D2): the hash is part of the URL, so the
# file is truly immutable — any content change produces a new URL. Safe to
# cache for a year. These patterns are listed AFTER the generic /*.js rule
# so they override it for matching filenames.
[[headers]]
  for = "/films-index-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

# Self-hosted fonts (added 2026-04-26 perf round). Filenames are stable
# identifiers — when we update a font we change the filename, not the
# bytes — so a year of immutable caching is safe. Browsers that already
# cached the previous filename will keep using it; new ones fetch the
# new file once.
[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

#############################################################
# Custom 404 for unknown routes
#############################################################

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
